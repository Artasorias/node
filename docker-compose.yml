services:
  geth: # this is Optimism's geth client
    build: .
    ports:
      - 127.0.0.1:8545:8545 # RPC (localhost only)
      - 127.0.0.1:8546:8546 # websocket (localhost only)
      - 30303:30303     # P2P TCP (currently unused)
      - 30303:30303/udp # P2P UDP (currently unused)
      - 127.0.0.1:7301:6060 # metrics (localhost only)
    command: [ "sh", "./geth-entrypoint" ]
    env_file:
      # select your network here:
#      - .env.goerli
#      - .env.mainnet
  node:
    build: .
    depends_on:
      - geth
    ports:
      - 127.0.0.1:7545:8545 # RPC (localhost only)
      - 9222:9222     # P2P TCP
      - 9222:9222/udp # P2P UDP
      - 127.0.0.1:7300:7300 # metrics (localhost only)
      - 127.0.0.1:6060:6060 # pprof (localhost only)
    command: [ "sh", "./op-node-entrypoint" ]
    env_file:
      # select your network here:
#      - .env.goerli
#      - .env.mainnet
